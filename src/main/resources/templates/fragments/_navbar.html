<div th:fragment="navbar">
  <div class="sidebar">
    <div class="login-register">
      <div class="logo">MC</div>
      <h1>MyCompany</h1>
      <div class="auth-buttons">
        <button class="auth-btn">Log In</button>
        <button class="auth-btn">Register</button>
      </div>
    </div>
    <!-- Theme Selector -->
    <div class="theme-selector">
      <h3>Theme</h3>
      <div class="theme-buttons">
        <button onclick="setTheme('blue')">Blue</button>
        <button onclick="setTheme('green')">Green</button>
        <button onclick="setTheme('dark')">Dark</button>
      </div>
    </div>
    <!-- Navigation Buttons -->
    <div class="nav-buttons">
      <button onclick="showContent('orders')" th:href="@{/orders}">Orders</button>
      <button onclick="showContent('stock')">Stock</button>
      <button onclick="showContent('output')">Output</button>
      <button onclick="showContent('maintenance')">Maintenance</button>
      <button onclick="showContent('reports')">Reports</button>
    </div>
  </div>
</div>
