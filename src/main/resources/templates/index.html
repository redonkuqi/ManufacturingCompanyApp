<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manufacturing Dashboard</title>
  <!-- Link your CSS -->
  <link rel="stylesheet" th:href="@{/style.css}" />
  <!-- Link your JS -->
  <script th:src="@{/script.js}"></script>
</head>
<body>
<div class="container">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="login-register">
      <div class="logo">MC</div>
      <h1>MyCompany</h1>
      <div class="auth-buttons">
        <button class="auth-btn">Log In</button>
        <button class="auth-btn">Register</button>
      </div>
    </div>
    <!-- Theme Selector -->
    <div class="theme-selector">
      <h3>Theme</h3>
      <div class="theme-buttons">
        <button onclick="setTheme('blue')">Blue</button>
        <button onclick="setTheme('green')">Green</button>
        <button onclick="setTheme('dark')">Dark</button>
      </div>
    </div>
    <!-- Navigation Buttons -->
    <div class="nav-buttons">
      <a th:href="@{/orders}" class="nav-btn">Orders</a>
      <a th:href="@{/stock}" class="nav-btn">Stock</a>
      <a th:href="@{/output}" class="nav-btn">Output</a>
      <a th:href="@{/maintenance}" class="nav-btn">Maintenance</a>
      <a th:href="@{/reports}" class="nav-btn">Reports</a>
    </div>
  </div>

  <!-- Main Content Area (Card) -->
  <div class="content" id="mainContent">
    <h2>Welcome to the Dashboard</h2>
    <p>Select an option from the sidebar to view details.</p>
  </div>
</div>
</body>
</html>
